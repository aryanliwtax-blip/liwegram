<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>liweeitax</title><style>
:root{--bg:#08080d;--panel:#111119;--panel2:#171720;--line:#292936;--text:#f6f6fa;--muted:#9292a3;--accent:#8b7cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#171329 0,#08080d 35%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1450px;margin:auto;display:grid;grid-template-columns:220px minmax(0,720px) 260px;gap:18px;min-height:100vh}.side,.right{padding:18px 10px;position:sticky;top:0;height:100vh}.logo{font-size:23px;font-weight:900;padding:12px}.nav{display:grid;gap:6px;margin-top:18px}.nav button{background:transparent;border:0;text-align:left;padding:12px;border-radius:12px}.nav button:hover{background:var(--panel2)}.main{padding:18px 0}.top{display:flex;gap:10px;position:sticky;top:0;z-index:5;background:#08080dcc;backdrop-filter:blur(12px);padding-bottom:10px}.top input,.field,.composer textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:11px;outline:none}.card{background:linear-gradient(180deg,#12121b,#101017);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 10px 35px #0003}.posthead,.row{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#252533}.media{display:block;width:100%;max-height:620px;object-fit:contain;border-radius:14px;margin-top:12px;background:#050509}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.ghost,.btn,.danger{border:1px solid var(--line);background:var(--panel2);padding:8px 11px;border-radius:11px}.btn{background:var(--accent);border-color:transparent;color:white;font-weight:800}.danger{border-color:#6e3030;color:#ffaaaA}.muted{color:var(--muted)}.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:11px;font-weight:900;box-shadow:0 0 0 2px #08080d}.verified-name{display:inline-flex;align-items:center;gap:5px}.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.setting{padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 16px;border-radius:999px;display:none;z-index:20}.empty{text-align:center;padding:45px;color:var(--muted)}.comment{padding:9px;border:1px solid var(--line);border-radius:12px;margin:7px 0}.sticker{font-size:26px;margin:3px}.cover{width:100%;height:150px;object-fit:cover;border-radius:14px;background:#1a1830}@media(max-width:950px){.app{display:block}.side{height:auto;position:sticky;top:0;z-index:10;background:#08080df2;padding:7px;border-bottom:1px solid var(--line)}.logo{display:none}.nav{display:flex;overflow:auto;margin:0}.nav button{white-space:nowrap}.right{display:none}.main{padding:10px}.grid{grid-template-columns:1fr}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}.modal.open{display:flex}.auth-modal{width:min(440px,100%);position:relative}.modal-close{position:absolute;right:12px;top:10px;border:0;background:transparent;color:inherit;font-size:28px;cursor:pointer}.auth-tabs{display:flex;gap:8px;margin-bottom:14px}.auth-tabs button{flex:1}.auth-modal label{display:block;margin:10px 0 5px}.auth-error{min-height:22px;color:#ff7b8a;margin-top:8px}.auth-switch{text-align:center;margin-top:12px}.linkbtn{border:0;background:transparent;color:#7bb7ff;cursor:pointer}.authbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.auth-actions{display:flex;gap:8px;flex-wrap:wrap}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.feature-grid .pill{font-size:12px}

.chat-shell{--chat-accent:var(--accent)}.chat-shell.theme-neon{--chat-accent:#00f5d4}.chat-shell.theme-y2k{--chat-accent:#ff7bd5}.chat-shell.theme-amoled{--chat-accent:#7aa7ff}.chat-header{display:flex;align-items:center;justify-content:space-between;gap:10px}.chat-messages{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto;padding:4px}.chat-bubble{max-width:82%;padding:10px 12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);align-self:flex-start}.chat-bubble.mine{align-self:flex-end;background:color-mix(in srgb,var(--chat-accent) 22%,var(--panel2));border-color:color-mix(in srgb,var(--chat-accent) 55%,var(--line))}.chat-meta{font-size:11px;color:var(--muted);margin-top:4px}.offline-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.offline-video-card{position:relative}.offline-video-card .offline-tag{position:absolute;right:24px;top:24px;z-index:2}.chat-compose{position:sticky;bottom:0;background:var(--panel);padding-top:8px}.</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#08080d"><meta name="mobile-web-app-capable" content="yes"></head><body><div class="app"><aside class="side"><div class="logo">✦ liweeitax</div><div class="nav"><button onclick="show('home')">⌂ Home</button><button onclick="show('explore')">⌕ Explore</button><button onclick="show('reels')">▶ Reels</button><button onclick="show('saved')">🔖 Saved</button><button onclick="show('notifications')">♡ Notifications</button><button onclick="show('profile')">◉ Profile</button><button onclick="show('chat')">✉ Chat</button><button onclick="show('settings')">⚙ Settings</button><button onclick="show('studio')">📊 Creator Studio</button><button onclick="show('features')">🚀 V11 Features</button><button onclick="openAuth('login')">↪ Login</button><button onclick="openAuth('register')">✦ Create an account</button></div></aside><main class="main"><div class="top"><input id="search" placeholder="Search users, posts, #hashtags..." oninput="searchUsers(this.value)"><button class="ghost" onclick="toggleTheme()">◐</button></div><div id="authbar" class="card authbar"></div><section id="content"></section></main><aside class="right"><div class="section"><b>🔥 Trending</b></div><div class="card">#liweeitax<br>#music<br>#y2k<br>#gaming<br>#reels</div><div class="card muted">✨ Mega Plus<br>Reels • Stickers • Pin comments • Chat • Privacy • Drafts • Themes</div></aside></div><div id="authModal" class="modal" aria-hidden="true"><div class="auth-modal card"><button class="modal-close" onclick="closeAuth()">×</button><div class="auth-tabs"><button id="loginTab" class="btn" onclick="setAuthMode('login')">Login</button><button id="registerTab" class="ghost" onclick="setAuthMode('register')">Create an account</button></div><h2 id="authTitle">Welcome back 👋</h2><p id="authHint" class="muted">Login to your Liweeitax account.</p><label>Username</label><input id="authUsername" class="field" autocomplete="username" placeholder="@username"><label>Password</label><input id="authPassword" class="field" type="password" autocomplete="current-password" placeholder="At least 6 characters"><div id="confirmWrap" style="display:none"><label>Confirm password</label><input id="authConfirm" class="field" type="password" autocomplete="new-password" placeholder="Repeat password"></div><div id="authError" class="auth-error"></div><button id="authSubmit" class="btn" style="width:100%;margin-top:12px" onclick="submitAuth()">Login</button><div class="auth-switch"><span id="authSwitchText">New here?</span> <button class="linkbtn" onclick="setAuthMode(document.getElementById('authMode').value==='login'?'register':'login')">Switch</button></div><input id="authMode" type="hidden" value="login"></div></div><div class="toast" id="toast"></div><script>
let me=null,view='home',searchTimer;const $=x=>document.querySelector(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(x){$('#toast').textContent=x;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',1800)}async function api(u,o={}){const opt={credentials:'same-origin',cache:'no-store',...o,headers:{Accept:'application/json',...(o.headers||{})}};let r=await fetch(u,opt);let j=await r.json().catch(()=>({}));if(r.status===401){me=null;updateAuthBar()}if(!r.ok)throw Error(j.error||('Request failed ('+r.status+')'));return j}async function refreshMe(){try{const out=await api('/api/me');me=out.user||null;return me}catch(e){me=null;return null}}async function ensureAuth(){const current=await refreshMe();if(!current){openAuth('login');return false}return true}async function init(){await refreshMe();updateAuthBar();try{await show('home')}catch(e){}}function media(p){if(!p.media)return '';if(p.media_type==='video')return `<div class="offline-media"><video class="media" controls playsinline preload="metadata" data-online-src="${p.media}" data-post-id="${p.id}"></video><div class="actions"><button class="ghost" onclick="playOffline(${p.id},'${encodeURIComponent(p.media)}')">📥 Download for offline</button><button class="ghost" onclick="removeOffline(${p.id})">🗑 Remove offline</button></div></div>`;return `<img class="media" src="${p.media}" loading="lazy">`}function card(p){return `<article class="card"><div class="posthead"><img class="avatar" src="${p.avatar||''}"><b>@${esc(p.username)}</b>${p.verified?'<span class="verified-badge" title="Verified account">✓</span>':''}<span class="muted">• ${new Date(p.created_at).toLocaleString()}</span></div><div style="margin-top:10px;white-space:pre-wrap">${esc(p.content)}</div>${media(p)}${p.music?`<div class="muted" style="margin-top:8px">♫ ${esc(p.music)}</div>`:''}<div class="actions"><button class="ghost" onclick="like(${p.id})">${p.liked?'♥':'♡'} ${p.likes||0}</button><button class="ghost" onclick="comments(${p.id})">💬 ${p.comments||0}</button><button class="ghost" onclick="save(${p.id})">🔖 ${p.saved?'Saved':''}</button><button class="ghost" onclick="viewPost(${p.id})">👁 ${p.views||0}</button><button class="ghost" onclick="sharePost(${p.id})">↗ Share</button>${me&&me.id===p.user_id?`<button class="danger" onclick="deletePost(${p.id})">🗑 Delete</button>`:''}</div></article>`}
async function show(v){view=v;const c=$('#content');try{if(v==='home'){let ps=await api('/api/feed');c.innerHTML=(me?`<div class="card composer"><textarea id="newpost" rows="3" placeholder="What's happening?"></textarea><div class="row" style="margin-top:8px"><input id="music" class="field" placeholder="♫ music (optional)"><button class="btn" onclick="post()">Post</button><button class="ghost" onclick="saveDraft()">Draft</button></div><input id="mediaFile" type="file" accept="image/*,video/*" style="margin-top:9px;width:100%"></div>`:'<div class="card"><b>Guest mode 👋</b><div class="muted">Browse freely. Login to post, like, save, comment and chat.</div></div>')+(ps.map(card).join('')||'<div class="empty">No posts yet.</div>')}else if(v==='explore'){if(!navigator.onLine){return showOfflineExplore()}let ps=await api('/api/explore');cacheOfflineExplore(ps);c.innerHTML='<div class="card offline-banner"><div><h2 style="margin:0">Explore 🔥</h2><div class="muted">Trending and popular content.</div></div><button class="ghost" onclick="showOfflineExplore()">📴 Offline Explore</button></div>'+ps.map(card).join('')||'<div class="empty">No content yet.</div>'}else if(v==='reels'){let ps=(await api('/api/feed')).filter(p=>p.media);c.innerHTML='<div class="card"><h2>Reels ▶</h2><div class="muted">Media-first feed.</div></div>'+ps.map(card).join('')||'<div class="empty">No media posts yet.</div>'}else if(v==='saved'){if(!(await ensureAuth()))return;let ps=await api('/api/saved');c.innerHTML='<h2>Saved 🔖</h2>'+(ps.map(card).join('')||'<div class="empty">Nothing saved.</div>')}else if(v==='notifications'){if(!(await ensureAuth()))return;let n=await api('/api/notifications');await api('/api/notifications/read',{method:'POST'});c.innerHTML='<div class="row"><h2 style="flex:1">Notifications</h2><button class="ghost" onclick="show(\'notifications\')">Refresh</button></div>'+(n.map(x=>`<div class="card"><b>${x.type}</b> ${esc(x.text)}<div class="muted">${new Date(x.created_at).toLocaleString()}</div></div>`).join('')||'<div class="empty">All quiet.</div>')}else if(v==='profile'){if(!(await ensureAuth()))return;await renderProfile(me.username)}else if(v==='trending'){let t=await api('/api/trending');let u=await api('/api/trending-users');c.innerHTML='<h2>🔥 Trending</h2><div class="card"><b>Hashtags</b>'+t.map(x=>`<div class="comment"><b>#${esc(x.tag)}</b><span class="muted"> ${x.posts} posts</span><button class="ghost" onclick="showHashtag('${esc(x.tag)}')">Open</button></div>`).join('')||'<div class="muted">No trends yet.</div>'+'</div><div class="card"><b>Creators</b>'+u.map(x=>`<div class="comment"><b>@${esc(x.username)}</b><span class="muted"> ${x.followers} followers</span></div>`).join('')+'</div>'}else if(v==='stories'){let st=await api('/api/stories');c.innerHTML='<h2>⭕ Stories</h2><div class="card"><input id="storyFile" type="file" accept="image/*,video/*"><input id="storyText" class="field" placeholder="Story caption"><button class="btn" onclick="postStory()">Post story</button></div>'+st.map(s=>`<div class="card"><b>@${esc(s.username)}</b><div>${esc(s.content||'')}</div>${s.media?(s.media.match(/\.mp4|\.webm|\.mov/i)?`<video class="media" controls src="${s.media}"></video>`:`<img class="media" src="${s.media}">`):''}<div class="muted">${s.views} views</div></div>`).join('')||'<div class="empty">No active stories.</div>'}else if(v==='settings'){if(!(await ensureAuth()))return;let s=await api('/api/settings');let cfg=JSON.parse(localStorage.getItem('lx_settings')||'{}');c.innerHTML=`<h2>Settings ⚙</h2><div class="card"><div class="setting"><b>Account 👤</b><p class="muted">@${esc(s.user.username)}</p><label>Bio</label><textarea id="setBio" class="field" rows="3">${esc(s.user.bio)}</textarea><label>Website</label><input id="setWeb" class="field" value="${esc(s.user.website)}"><label style="display:block;margin-top:10px"><input id="setPrivate" type="checkbox" ${s.user.private?'checked':''}> Private account</label><button class="btn" style="margin-top:12px" onclick="saveSettings()">Save account</button></div></div><div class="card"><div class="setting"><b>Privacy & Safety 🔒</b><label><input id="setOnline" type="checkbox" ${cfg.online!==false?'checked':''}> Show online status</label><label><input id="setSeen" type="checkbox" ${cfg.seen!==false?'checked':''}> Read receipts</label><label><input id="setTags" type="checkbox" ${cfg.tags!==false?'checked':''}> Allow tags & mentions</label><label><input id="setComments" type="checkbox" ${cfg.comments!==false?'checked':''}> Allow comments</label><button class="ghost" onclick="savePrefs()">Save privacy</button></div></div><div class="card"><div class="setting"><b>Notifications 🔔</b><label><input id="nLike" type="checkbox" ${cfg.nLike!==false?'checked':''}> Likes</label><label><input id="nComment" type="checkbox" ${cfg.nComment!==false?'checked':''}> Comments</label><label><input id="nFollow" type="checkbox" ${cfg.nFollow!==false?'checked':''}> Follows</label><label><input id="nChat" type="checkbox" ${cfg.nChat!==false?'checked':''}> Messages & 🔥 streaks</label><label><input id="nStory" type="checkbox" ${cfg.nStory!==false?'checked':''}> Stories</label><button class="ghost" onclick="savePrefs()">Save notifications</button></div></div><div class="card"><div class="setting"><b>Chat & Media 💬</b><label><input id="typing" type="checkbox" ${cfg.typing!==false?'checked':''}> Typing indicator</label><label><input id="auto" type="checkbox" ${cfg.auto!==false?'checked':''}> Auto-play media</label><label><input id="dataSaver" type="checkbox" ${cfg.dataSaver?'checked':''}> Data Saver</label><label>Chat theme <select id="chatTheme" class="field"><option>Default</option><option>Neon</option><option>Y2K</option><option>AMOLED</option></select></label></div></div><div class="card"><div class="setting"><b>Appearance 🎨</b><label>Theme <select id="themePref" class="field"><option value="dark">Dark</option><option value="light">Light</option><option value="amoled">AMOLED</option></select></label><label>Font size <select id="fontPref" class="field"><option>Small</option><option selected>Medium</option><option>Large</option></select></label><button class="ghost" onclick="applyPrefs()">Apply appearance</button></div></div><div class="card"><div class="setting"><b>Creator & Social ⚡</b><p class="muted">Stories, reactions, reposts, hashtags, collections and chat streaks are enabled.</p><button class="ghost" onclick="show('trending')">Open Trending</button> <button class="ghost" onclick="show('stories')">Open Stories</button></div></div><div class="card"><div class="setting"><b>Activity 📊</b><p class="muted">Saved posts, drafts, notifications, reactions and creator analytics are available.</p><button class="ghost" onclick="show('saved')">Saved</button> <button class="ghost" onclick="show('notifications')">Notifications</button></div></div><div class="card"><div class="setting"><b>Safety 🛡️</b><p class="muted">Blocked and muted accounts are hidden from your feed.</p><button class="danger" onclick="logout()">Log out</button></div></div><div class="card"><div class="setting"><b>Drafts 📝</b><div id="drafts">Loading...</div></div></div>`;if(cfg.chatTheme)$('#chatTheme').value=cfg.chatTheme;if(cfg.themePref)$('#themePref').value=cfg.themePref;if(cfg.fontPref)$('#fontPref').value=cfg.fontPref;loadDrafts()}else if(v==='chat'){if(!(await ensureAuth()))return;const cfg=getPrefs();c.innerHTML='<div class="card chat-shell theme-'+esc(String(cfg.chatTheme||'Default').toLowerCase())+'"><div class="chat-header"><div><h2 style="margin:0">Chat ✉</h2><div class="muted">Private messages with themes, streaks and media.</div></div><select id="chatThemeQuick" class="field" style="max-width:150px"><option>Default</option><option>Neon</option><option>Y2K</option><option>AMOLED</option></select></div><div class="card"><input id="chatid" class="field" placeholder="User ID"><button class="btn" style="margin-top:8px" onclick="openChat()">Open chat</button></div></div>';$('#chatThemeQuick').value=cfg.chatTheme||'Default';$('#chatThemeQuick').onchange=()=>{const x=getPrefs();x.chatTheme=$('#chatThemeQuick').value;localStorage.setItem('lx_settings',JSON.stringify(x));show('chat')}}}catch(e){c.innerHTML=`<div class="card"><b>Something went wrong.</b><div class="muted">${esc(e.message)}</div><button class="btn" onclick="show('${v}')">Retry</button></div>`}}
async function post(){if(!me)return auth();let fd=new FormData();fd.append('content',$('#newpost').value);fd.append('music',$('#music').value);if($('#mediaFile').files[0])fd.append('media',$('#mediaFile').files[0]);await api('/api/posts',{method:'POST',body:fd});toast('Posted ✨');show('home')}async function like(id){if(!me)return auth();await api('/api/posts/'+id+'/like',{method:'POST'});show(view)}async function save(id){if(!me)return auth();let x=await api('/api/posts/'+id+'/save',{method:'POST'});toast(x.saved?'Saved 🔖':'Removed');show(view)}async function deletePost(id){if(confirm('Delete this post?')){await api('/api/posts/'+id,{method:'DELETE'});toast('Deleted');show(view)}}async function comments(id){let x=await api('/api/posts/'+id+'/comments');let html=x.map(c=>`<div class="comment">${c.pinned?'📌 ':''}<b>@${esc(c.username)}</b>: ${esc(c.content)} ${me&&c.pinned?'<span class="pill">Pinned</span>':''}${me&&c.user_id===me.id?` <button class="danger" onclick="deleteComment(${c.id},${id})">delete</button>`:''}</div>`).join('');let text=prompt((html?x.map(c=>(c.pinned?'📌 ':'')+'#'+c.id+' @'+c.username+': '+c.content).join('\n'):'No comments yet.')+'\n\nWrite a comment:');if(text&&me){await api('/api/posts/'+id+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text})});show(view)}}async function deleteComment(cid,pid){await api('/api/comments/'+cid,{method:'DELETE'});toast('Comment deleted');comments(pid)}async function pinComment(id){let x=await api('/api/posts/'+id+'/comments');if(!x.length)return toast('No comments');let pick=prompt('Enter comment ID to pin:\n'+x.map(c=>c.id+' — @'+c.username+': '+c.content).join('\n'));if(pick)await api('/api/comments/'+pick.trim()+'/pin',{method:'POST'})}async function searchUsers(q){clearTimeout(searchTimer);if(!q){if(view==='home')show('home');return}searchTimer=setTimeout(async()=>{let x=await api('/api/search?q='+encodeURIComponent(q));$('#content').innerHTML='<h2>Search</h2><div class="card"><b>Users</b>'+(x.users.map(u=>`<div class="comment"><img class="avatar" src="${u.avatar||''}"> <b class="verified-name">@${esc(u.username)} ${u.verified?'<span class="verified-badge" title="Verified account">✓</span>':''}</b><div class="muted">${esc(u.bio)}</div><button class="ghost" onclick="renderProfile('${esc(u.username)}')">Open profile</button></div>`).join('')||'<div class="muted">No users.</div>')+'</div><div class="card"><b>Posts</b>'+x.posts.map(card).join('')+'</div>'},250)}
async function showHashtag(tag){let ps=await api('/api/hashtag/'+encodeURIComponent(tag));$('#content').innerHTML='<h2>#'+esc(tag)+'</h2>'+(ps.map(card).join('')||'<div class="empty">No posts.</div>')}async function postStory(){if(!me)return auth();let f=$('#storyFile').files[0];if(!f)return toast('Choose a photo or video');let fd=new FormData();fd.append('media',f);fd.append('content',$('#storyText').value);await api('/api/stories',{method:'POST',body:fd});toast('Story posted ⭕');show('stories')}async function react(id,r){if(!me)return auth();await api('/api/posts/'+id+'/reaction',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reaction:r})});toast(r+' reaction')}async function repost(id){if(!me)return auth();let q=prompt('Add a quote (optional):','');let x=await api('/api/posts/'+id+'/repost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quote:q||''})});toast(x.reposted?'Reposted 🔁':'Repost removed')}async function chatStreak(id){let s=await api('/api/chat-streak/'+id);toast((s.streak||0)+'🔥 chat streak')}async function renderProfile(username){let p=await api('/api/profile/'+encodeURIComponent(username));$('#content').innerHTML=`${p.user.cover?`<img class="cover" src="${p.user.cover}">`:''}<div class="card"><div class="row"><img class="avatar" style="width:78px;height:78px" src="${p.user.avatar||''}"><div style="flex:1"><h2>@${esc(p.user.username)} ${p.user.verified?`<span class="verified-badge" title="${esc(p.user.verification_label||'Verified account')}">✓</span>`:''}</h2><div>${esc(p.user.bio)}</div><div class="muted">${p.followers} followers • ${p.following} following • Level ${p.user.level} • ${p.user.streak}🔥</div></div></div><div style="margin-top:12px"><b>Profile stickers</b><div>${p.stickers.map(x=>`<span class="sticker" title="sent by @${esc(x.username)}">${esc(x.sticker)}</span>`).join('')||'<span class="muted">None yet</span>'}</div></div>${me&&me.id!==p.user.id?`<div class="actions"><button class="btn" onclick="followUser(${p.user.id})">${p.isFollowing?'Following':'Follow'}</button><button class="ghost" onclick="sendProfileSticker(${p.user.id})">✨ Send sticker</button><button class="ghost" onclick="relationship(${p.user.id})">⋯ More</button></div>`:''}</div>${p.privateLocked?'<div class="empty">🔒 This account is private.</div>':(p.posts.map(card).join('')||'<div class="empty">No posts.</div>')}`}async function followUser(id){let x=await api('/api/users/'+id+'/follow',{method:'POST'});toast(x.following?'Following ✓':'Unfollowed');renderProfile((await api('/api/profile/'+id)).user.username)}async function sendProfileSticker(id){let s=prompt('Sticker: 😀 🔥 ❤️ ⭐ 😎 👑 🦋 🫶 🎀 🐱 🚀 💎');if(s)await api('/api/profile/'+id+'/sticker',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sticker:s})});toast('Sticker sent ✨')}async function relationship(id){let r=await api('/api/relationship/'+id);let choice=prompt(`1 = ${r.blocked?'Unblock':'Block'}\n2 = ${r.muted?'Unmute':'Mute'}`);if(choice==='1')await api('/api/block/'+id,{method:'POST'});if(choice==='2')await api('/api/mute/'+id,{method:'POST'});toast('Updated');show('home')}function getPrefs(){return JSON.parse(localStorage.getItem('lx_settings')||'{}')}function savePrefs(){let c=getPrefs();['online','seen','tags','comments','nLike','nComment','nFollow','nChat','nStory','typing','auto','dataSaver'].forEach(k=>{let e=$('#'+({online:'setOnline',seen:'setSeen',tags:'setTags',comments:'setComments',nLike:'nLike',nComment:'nComment',nFollow:'nFollow',nChat:'nChat',nStory:'nStory',typing:'typing',auto:'auto',dataSaver:'dataSaver'}[k]));if(e)c[k]=e.checked});c.chatTheme=$('#chatTheme')?.value||c.chatTheme;c.themePref=$('#themePref')?.value||c.themePref;c.fontPref=$('#fontPref')?.value||c.fontPref;localStorage.setItem('lx_settings',JSON.stringify(c));toast('Preferences saved ✓')}function applyPrefs(){savePrefs();let c=getPrefs();document.body.classList.toggle('light',c.themePref==='light');if(c.themePref==='amoled'){document.documentElement.style.setProperty('--bg','#000');document.documentElement.style.setProperty('--panel','#050505')}else{document.documentElement.style.setProperty('--bg',c.themePref==='light'?'#f4f4f8':'#08080d');document.documentElement.style.setProperty('--panel',c.themePref==='light'?'#fff':'#111119')}document.documentElement.style.fontSize=c.fontPref==='Small'?'14px':c.fontPref==='Large'?'18px':'16px';toast('Appearance applied 🎨')}async function saveSettings(){await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bio:$('#setBio').value,website:$('#setWeb').value,private:$('#setPrivate').checked})});me=(await api('/api/me')).user;toast('Settings saved ✓')}async function saveDraft(){if(!me)return auth();await api('/api/drafts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:$('#newpost').value,music:$('#music').value})});toast('Draft saved 📝')}async function loadDrafts(){let d=await api('/api/drafts');$('#drafts').innerHTML=d.map(x=>`<div class="comment"><b>${esc(x.content||'(empty)')}</b><div class="muted">${new Date(x.updated_at).toLocaleString()}</div><button class="ghost" onclick="useDraft(${x.id},${JSON.stringify(x.content||'')},${JSON.stringify(x.music||'')})">Use</button><button class="danger" onclick="deleteDraft(${x.id})">Delete</button></div>`).join('')||'<span class="muted">No drafts.</span>'}async function useDraft(id,content,music){show('home');setTimeout(()=>{$('#newpost').value=content;$('#music').value=music},100)}async function deleteDraft(id){await api('/api/drafts/'+id,{method:'DELETE'});loadDrafts()}async function openChat(){let id=Number($('#chatid')?.value);if(!id)return toast('Enter a valid user ID');try{let x=await api('/api/chats/'+id);const cfg=getPrefs();const theme=String(cfg.chatTheme||'Default').toLowerCase();$('#content').innerHTML='<div class="card chat-shell theme-'+esc(theme)+'"><div class="chat-header"><div><h2 style="margin:0">Chat ✉</h2><div class="muted">User #'+id+' • '+(x.length?'Conversation loaded':'Start the conversation')+'</div></div><div class="actions"><button class="ghost" onclick="chatStreak('+id+')">🔥 Streak</button><button class="ghost" onclick="show(\'chat\')">← Chats</button></div></div><div id="msgs" class="chat-messages">'+x.map(m=>'<div class="chat-bubble '+(me&&m.sender_id===me.id?'mine':'')+'"><b>@'+esc(m.username)+'</b><div>'+esc(m.content||'')+'</div>'+(m.media?'<img class="media" src="'+esc(m.media)+'">':'')+'<div class="chat-meta">'+(m.seen?'Seen':'Delivered')+' • '+new Date(m.created_at).toLocaleString()+'</div></div>').join('')+'</div><div class="card chat-compose"><div class="row"><input id="msg" class="field" placeholder="Message..." onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendMsg('+id+')}"><button class="btn" onclick="sendMsg('+id+')">Send</button></div></div></div>';const box=$('#msgs');if(box)box.scrollTop=box.scrollHeight}catch(e){toast(e.message||'Chat unavailable')}}async function sendMsg(id){const input=$('#msg');const content=input?.value.trim();if(!content)return toast('Write a message first');try{let x=await api('/api/chats/'+id,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'content='+encodeURIComponent(content)});toast((x.streak||0)+'🔥 streak');const box=input; if(box)box.value=''; await openChat()}catch(e){toast(e.message||'Message failed')}}async function sharePost(id){try{await navigator.clipboard.writeText(location.origin+'/#post='+id);toast('Link copied ↗')}catch{toast('Share link unavailable')}}async function viewPost(id){await api('/api/posts/'+id+'/view',{method:'POST'});toast('View counted 👁')}function toggleTheme(){document.body.classList.toggle('light');document.documentElement.style.setProperty('--bg',document.body.classList.contains('light')?'#f4f4f8':'#08080d');document.documentElement.style.setProperty('--panel',document.body.classList.contains('light')?'#fff':'#111119');toast('Theme toggled')}let authMode='login';
function openAuth(mode='login'){setAuthMode(mode);document.getElementById('authModal').classList.add('open');document.getElementById('authModal').setAttribute('aria-hidden','false');setTimeout(()=>document.getElementById('authUsername').focus(),30)}
function closeAuth(){document.getElementById('authModal').classList.remove('open');document.getElementById('authModal').setAttribute('aria-hidden','true');document.getElementById('authError').textContent=''}
function setAuthMode(mode){authMode=mode;document.getElementById('authMode').value=mode;const reg=mode==='register';document.getElementById('authTitle').textContent=reg?'Create your Liweeitax account ✦':'Welcome back 👋';document.getElementById('authHint').textContent=reg?'Create an account and join the community.':'Login to your Liweeitax account.';document.getElementById('authSubmit').textContent=reg?'Create account':'Login';document.getElementById('confirmWrap').style.display=reg?'block':'none';document.getElementById('loginTab').className=reg?'ghost':'btn';document.getElementById('registerTab').className=reg?'btn':'ghost';document.getElementById('authSwitchText').textContent=reg?'Already have an account?':'New here?';document.getElementById('authError').textContent=''}
async function submitAuth(){const u=document.getElementById('authUsername').value.trim(),p=document.getElementById('authPassword').value,cp=document.getElementById('authConfirm').value;const err=document.getElementById('authError');err.textContent='';if(!u||!p){err.textContent='Enter your username and password.';return}if(authMode==='register'&&p!==cp){err.textContent='Passwords do not match.';return}if(authMode==='register'&&p.length<6){err.textContent='Password must be at least 6 characters.';return}const btn=document.getElementById('authSubmit');btn.disabled=true;try{const out=await api(authMode==='login'?'/api/login':'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});await refreshMe();if(!me)throw Error('Session was not established. Please try again.');closeAuth();toast(authMode==='login'?'Logged in ✓':'Account created ✓');updateAuthBar();await show('home')}catch(e){err.textContent=e.message||'Something went wrong.'}finally{btn.disabled=false}}
function auth(){openAuth('login')}
function updateAuthBar(){const el=document.getElementById('authbar');if(!el)return;if(me){el.innerHTML='<div><b>Signed in as @'+esc(me.username)+'</b>'+(me.verified?' <span class="verified-badge">✓</span>':'')+'</div><div class="auth-actions"><button class="ghost" onclick="show(\'profile\')">Profile</button><button class="danger" onclick="logout()">Log out</button></div>'}else{el.innerHTML='<div><b>Join Liweeitax</b><div class="muted">Browse as a guest or sign in to interact.</div></div><div class="auth-actions"><button class="ghost" onclick="openAuth(\'login\')">Login</button><button class="btn" onclick="openAuth(\'register\')">Create an account</button></div>'}}
async function logout(){await api('/api/logout',{method:'POST'});me=null;toast('Logged out');show('home')}/* Offline/PWA layer: same-origin only; no third-party network dependency. */
const OFFLINE_DB='liweeitax-offline-v1';
function openOfflineDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(OFFLINE_DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('videos'))db.createObjectStore('videos',{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function putOfflineVideo(id,blob,src){const db=await openOfflineDB();return new Promise((resolve,reject)=>{const tx=db.transaction('videos','readwrite');tx.objectStore('videos').put({id,blob,src,savedAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
async function getOfflineVideo(id){const db=await openOfflineDB();return new Promise((resolve,reject)=>{const tx=db.transaction('videos','readonly');const r=tx.objectStore('videos').get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);});}
async function deleteOfflineVideo(id){const db=await openOfflineDB();return new Promise((resolve,reject)=>{const tx=db.transaction('videos','readwrite');tx.objectStore('videos').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
async function playOffline(id,encodedSrc){const src=decodeURIComponent(encodedSrc);try{const saved=await getOfflineVideo(id);if(saved){const v=document.querySelector(`video[data-post-id="${id}"]`);if(v){v.src=URL.createObjectURL(saved.blob);v.play().catch(()=>{});}return;}if(!navigator.onLine)return toast('This video is not downloaded for offline use.');toast('Downloading video…');const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw Error('download failed');const blob=await r.blob();await putOfflineVideo(id,blob,src);const v=document.querySelector(`video[data-post-id="${id}"]`);if(v){v.src=URL.createObjectURL(blob);v.play().catch(()=>{});}toast('Saved for offline ✓')}catch(e){toast('Offline download failed')}}
async function removeOffline(id){try{await deleteOfflineVideo(id);toast('Removed from offline ✓')}catch{toast('Could not remove')}}
async function hydrateOfflineVideos(){document.querySelectorAll('video[data-post-id]').forEach(async v=>{const x=await getOfflineVideo(Number(v.dataset.postId));if(x){v.src=URL.createObjectURL(x.blob);v.dataset.offline='1';}else if(navigator.onLine){v.src=v.dataset.onlineSrc;}})}

async function showV11Features(){const x=await api('/api/features');const groups={};x.features.forEach(f=>(groups[f.category]??=[]).push(f));let html='<div class="card"><h2>🚀 Liweeitax V11</h2><p class="muted">'+x.count+' capability entries • active features are marked ✓ and future integration points are marked ◇</p></div>';for(const [g,arr] of Object.entries(groups)){html+='<div class="card"><h3>'+esc(g)+' • '+arr.length+'</h3><div class="feature-grid">'+arr.map(f=>'<div class="pill">'+(f.status==='active'?'✓ ':'◇ ')+esc(f.name)+'</div>').join('')+'</div></div>'}document.querySelector('#content').innerHTML=html}
async function cacheOfflineShell(){if('serviceWorker' in navigator)try{await navigator.serviceWorker.register('/sw.js',{scope:'/'});}catch(e){} }
function cacheOfflineFeed(rows){try{localStorage.setItem('lx_offline_feed',JSON.stringify(rows||[]));localStorage.setItem('lx_offline_feed_at',String(Date.now()));}catch(e){}}
function readOfflineFeed(){try{return JSON.parse(localStorage.getItem('lx_offline_feed')||'[]')}catch{return []}}
async function cacheOfflineExplore(rows){try{localStorage.setItem('lx_offline_explore',JSON.stringify(rows||[]));localStorage.setItem('lx_offline_explore_at',String(Date.now()))}catch(e){}}
function readOfflineExplore(){try{return JSON.parse(localStorage.getItem('lx_offline_explore')||'[]')}catch{return []}}
async function showOfflineExplore(){const rows=readOfflineExplore();const videos=rows.filter(p=>p.media&&p.media_type==='video');const c=$('#content');if(!rows.length){c.innerHTML='<div class="card"><h2>Explore 📴</h2><p class="muted">Nothing is cached yet. Open Explore while online once, then download videos for offline viewing.</p><button class="btn" onclick="show(\'explore\')">Try online Explore</button></div>';return}c.innerHTML='<div class="card offline-banner"><div><h2 style="margin:0">Offline Explore 📴</h2><div class="muted">Cached Explore content. Downloaded videos play without a network connection.</div></div><span class="pill">'+videos.length+' video(s)</span></div>'+rows.map(p=>p.media_type==='video'?'<div class="offline-video-card">'+card(p)+'</div>':card(p)).join('');setTimeout(hydrateOfflineVideos,20)}
const _show=show;show=async function(v){view=v;try{if(v==='explore'&&navigator.onLine){const rows=await api('/api/explore');cacheOfflineExplore(rows)}await _show(v);if(v==='home'&&navigator.onLine){const rows=await api('/api/feed');cacheOfflineFeed(rows)}}catch(e){if(!navigator.onLine){if(v==='explore')return showOfflineExplore();const rows=readOfflineFeed();if(rows.length){document.querySelector('#content').innerHTML='<div class="card offline-banner"><b>📴 Offline mode</b><button class="ghost" onclick="showOfflineExplore()">Offline Explore</button></div>'+rows.map(card).join('');setTimeout(hydrateOfflineVideos,20);return}}document.querySelector('#content').innerHTML='<div class="card"><b>Could not load this section.</b><div class="muted">'+esc(e.message||'Network error')+'</div><button class="btn" onclick="show(\''+String(v).replace(/[^a-z]/g,'')+'\')">Retry</button></div>'}setTimeout(hydrateOfflineVideos,50)};window.addEventListener('online',()=>{toast('Back online ✓');if(view==='explore')show('explore')});window.addEventListener('offline',()=>toast('Offline mode 📴'));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAuth()});cacheOfflineShell();init();
</script></body></html>
